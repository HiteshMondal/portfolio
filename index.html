<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hitesh Mondal · Cloud and DevOps Engineer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0a1a3a;--bg2:#0f2350;--fg:#eaf1ff;--mut:#a3b8e0;--ln:rgba(160,195,255,.22);--grid:rgba(160,195,255,.07);--acc:#ffd23f;--accfg:#0a1a3a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3fb;--bg2:#fff;--fg:#0a1a3a;--mut:#46597f;--ln:rgba(10,26,58,.2);--grid:rgba(10,26,58,.06);--acc:#1d4ed8;--accfg:#fff;color-scheme:light}}
:root[data-theme="light"]{--bg:#eef3fb;--bg2:#fff;--fg:#0a1a3a;--mut:#46597f;--ln:rgba(10,26,58,.2);--grid:rgba(10,26,58,.06);--acc:#1d4ed8;--accfg:#fff;color-scheme:light}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;color:var(--fg);font:16px/1.65 "IBM Plex Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.w{max-width:1100px;margin:auto;padding:0 24px}
h1,h2,h3,.logo,.big,.mini strong{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:16px;align-items:center;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.nav nav{display:flex;gap:16px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.logo{font-weight:800;white-space:nowrap}
.lk{background:none;border:0;color:var(--mut);font:inherit;font-size:15px;cursor:pointer;padding:4px 2px;white-space:nowrap;text-transform:capitalize}
.lk:hover{color:var(--fg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;min-height:calc(100svh - 70px);padding:56px 0}
.kick{color:var(--mut);margin-bottom:12px}
h1{font-size:clamp(3.4rem,9vw,7rem);line-height:.9;letter-spacing:-.035em;font-weight:800}
.lead{font-size:1.2rem;max-width:30em;margin:24px 0 28px}
.swap{display:inline-block;padding:0 8px;background:var(--acc);color:var(--accfg);font-weight:600;border-radius:3px;animation:sw .5s ease}
@keyframes sw{from{opacity:0;transform:translateY(8px)}}
.cta,.tools,.links{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;padding:10px 18px;border-radius:6px;border:1px solid var(--ln);background:transparent;color:var(--fg);font:600 15px "IBM Plex Sans",sans-serif;cursor:pointer;text-decoration:none;transition:border-color .2s,transform .2s}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.p{background:var(--acc);color:var(--accfg);border-color:transparent}
.term{background:#06112a;color:#d6e4ff;border:1px solid var(--ln);border-radius:8px;font:13px/1.75 "JetBrains Mono",ui-monospace,monospace;overflow:hidden;box-shadow:0 0 0 6px color-mix(in srgb,var(--fg) 5%,transparent)}
.bar{display:flex;gap:7px;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(160,195,255,.2)}
.bar i{width:10px;height:10px;border-radius:50%;background:#ffd23f}.bar i:nth-child(2){background:#5eead4}.bar i:nth-child(3){background:#7c9cff}
.bar span{margin-left:auto;color:#8aa0cc}
.term pre{padding:16px 18px;min-height:290px;font:inherit;overflow-x:auto}
.pr{color:#ffd23f}.ok{color:#5eead4}
.cur{display:inline-block;width:8px;height:15px;background:#ffd23f;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.sec{display:grid;grid-template-columns:210px 1fr;gap:32px;padding:72px 0;border-top:1px solid var(--ln)}
.sec h2{position:sticky;top:90px;align-self:start;font-size:clamp(1.5rem,3vw,2rem);line-height:1.1;font-weight:800}
.body{max-width:68ch;margin-bottom:14px}
.muted{color:var(--mut);font-size:.95rem}
.row{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--ln)}
.row>span{color:var(--mut)}
.chip{display:inline-block;padding:3px 10px;margin:0 6px 6px 0;border:1px solid var(--ln);border-radius:4px;font:13px "JetBrains Mono",monospace;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.card{position:relative;border:1px solid var(--ln);border-radius:8px;padding:24px;margin-bottom:20px;background:color-mix(in srgb,var(--bg2) 80%,transparent);overflow:hidden}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(280px circle at var(--mx,-999px) var(--my,-999px),color-mix(in srgb,var(--acc) 18%,transparent),transparent)}
.card>*{position:relative}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.head h3{font-size:1.3rem;line-height:1.25}
.pts{padding-left:18px;margin:14px 0}.pts li{margin-bottom:8px}
.mini{display:flex;flex-wrap:wrap;gap:12px 32px;margin:16px 0}
.mini strong{display:block;font-size:2rem;line-height:1;color:var(--acc)}.mini span{font-size:.85rem;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.stats .card{margin:0}
.big{display:block;font-size:3rem;line-height:1;margin-bottom:8px;color:var(--acc)}
.paper{background:#fff;color:#111827;max-width:820px;padding:44px;border-radius:4px;font-size:14px;line-height:1.55;box-shadow:0 24px 60px rgba(0,0,0,.35);margin-top:20px}
.paper h1{font-size:2rem;line-height:1.1;letter-spacing:0}.paper .sub{color:#4b5563;font-size:12.5px}
.paper h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #d1d5db;margin:18px 0 6px;padding-bottom:3px}
.paper .r{float:right;color:#4b5563}.paper .pts{margin:4px 0 8px}.paper .pts li{margin-bottom:2px}
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}.contact .card{margin:0}
label{display:block;margin-bottom:14px;font-size:.9rem;color:var(--mut)}
input,textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:6px;border:1px solid var(--ln);background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--fg);font:16px "IBM Plex Sans",sans-serif}
.links{flex-direction:column;align-items:stretch}.links .btn{justify-content:center}.note{min-height:1.5em;margin-top:10px;color:var(--acc);font-size:.9rem}
.foot{text-align:center;padding:32px 24px 48px;color:var(--mut);border-top:1px solid var(--ln)}
@media (max-width:820px){.hero,.contact{grid-template-columns:1fr}.sec{grid-template-columns:1fr;gap:20px;padding:48px 0}.sec h2{position:static}.row{grid-template-columns:1fr;gap:4px}.paper{padding:22px}.hero{min-height:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.np,.nav{display:none!important}body{background:#fff}:root{padding:0}.sec{display:block;padding:0;border:0}.paper{box-shadow:none;max-width:none;padding:0;margin:0}}

:root{--acc2:#5eead4}
:root[data-theme="light"]{--acc2:#0891b2}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--acc2:#0891b2}}
.net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55}
.aur{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aur i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:fl 18s ease-in-out infinite alternate}
.aur i:nth-child(1){background:var(--acc);top:-18vmax;left:-10vmax}
.aur i:nth-child(2){background:var(--acc2);bottom:-20vmax;right:-8vmax;animation-delay:-6s}
.aur i:nth-child(3){background:#6d7cff;top:30%;left:40%;opacity:.16;animation-delay:-12s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.18)}}
.glow{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 15%,transparent),transparent 65%);pointer-events:none;z-index:1;will-change:transform}
@media (hover:none){.glow{display:none}}
.prog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:40;background:linear-gradient(90deg,var(--acc),var(--acc2));transform:scaleX(0);transform-origin:left}
.w,.foot{position:relative;z-index:2}
.lk{position:relative}.lk::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));transform:scaleX(0);transition:transform .3s}
.lk.on{color:var(--fg)}.lk.on::after,.lk:hover::after{transform:scaleX(1)}
.ch{display:inline-block;background:linear-gradient(100deg,var(--fg) 30%,var(--acc) 45%,var(--acc2) 55%,var(--fg) 70%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .9s cubic-bezier(.2,.8,.2,1) both,sh 5s ease-in-out infinite;animation-delay:calc(var(--i)*70ms),calc(var(--i)*-180ms)}
.word{display:inline-block}
@keyframes rise{from{opacity:0;transform:translateY(.6em) rotateX(70deg) scale(.8);filter:blur(8px)}}
@keyframes sh{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.kick,.lead,.cta{animation:up .9s .8s cubic-bezier(.2,.8,.2,1) both}.lead{animation-delay:1s}.cta{animation-delay:1.2s}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
.hero .term{animation:up 1s .5s cubic-bezier(.2,.8,.2,1) both}
.tl{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;will-change:transform}
.btn.p{position:relative;overflow:hidden}.btn.p::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4s 2s infinite}
@keyframes shine{to{left:130%}}
.mq{overflow:hidden;white-space:nowrap;margin:0 -24px;border-block:1px solid var(--ln);padding:10px 0;mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq+.mq{border-top:0}
.mt{display:inline-flex;animation:mq 38s linear infinite}.mt.rev{animation-direction:reverse;animation-duration:46s}
.mt span{margin:0 18px;font:600 15px "JetBrains Mono",monospace;color:var(--mut)}.mt span::before{content:"◆ ";color:var(--acc);font-size:10px}
@keyframes mq{to{transform:translateX(-50%)}}
.rv{opacity:0;transform:translateY(36px) scale(.98);filter:blur(6px);transition:opacity .8s cubic-bezier(.2,.7,.2,1) calc(var(--i,0)*100ms),transform .8s cubic-bezier(.2,.7,.2,1) calc(var(--i,0)*100ms),filter .8s calc(var(--i,0)*100ms)}
.rv.in{opacity:1;transform:none;filter:none}
h2.rv{transform:translateX(-30px)}h2.rv.in{transform:none}
.hd::after{content:"";display:block;height:3px;width:0;margin-top:10px;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:2px;transition:width .9s .35s cubic-bezier(.2,.7,.2,1)}.hd.in::after{width:56px}
.rv:not(.in) .chip{opacity:0}.in .chip{animation:pop .55s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--k)*35ms + 250ms)}
@keyframes pop{from{opacity:0;transform:scale(.5) translateY(10px)}}
.chip:hover{transform:translateY(-3px);box-shadow:0 6px 16px -6px var(--acc)}
.sk h3{font-size:1.05rem;margin-bottom:12px;color:var(--acc)}
.card{backdrop-filter:blur(6px)}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
.proj::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0 65%,var(--acc),var(--acc2),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
@keyframes spin{to{--ang:360deg}}
.big{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pdf{max-width:900px}
.pbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--ln);border-bottom:0;border-radius:8px 8px 0 0;background:color-mix(in srgb,var(--bg2) 85%,transparent)}
.fn{font:13px "JetBrains Mono",monospace;color:var(--mut);margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tabs{display:flex;gap:6px}.tab{padding:6px 12px;border-radius:6px;border:1px solid var(--ln);background:none;color:var(--mut);font:600 14px "IBM Plex Sans",sans-serif;cursor:pointer}.tab.on{background:var(--acc);color:var(--accfg);border-color:transparent}
.zoom{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px}.zoom button{width:30px;height:30px;border-radius:6px;border:1px solid var(--ln);background:none;color:var(--fg);font-size:18px;cursor:pointer}.zoom button:hover{border-color:var(--acc)}
.pview{display:flex;flex-direction:column;max-height:78vh;overflow:auto;padding:24px;border:1px solid var(--ln);border-radius:0 0 8px 8px;background:color-mix(in srgb,var(--bg) 55%,#000 45%)}
.pg{display:block;max-width:none;height:auto;margin:0 auto 24px;background:#fff;border-radius:2px;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:up .8s calc(var(--i)*150ms) both;transition:width .3s}
@media (max-width:820px){.mq{margin:0 -24px}.pview{padding:12px}}
@media (prefers-reduced-motion:reduce){.rv,.rv:not(.in) .chip,.ch,.kick,.lead,.cta,.hero .term{opacity:1!important;transform:none!important;filter:none!important}.prog,.glow{display:none}}
</style>
</head>
<body><div id="root"></div><script>/*APP*/</script></body>
</html>
