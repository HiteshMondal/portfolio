<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hitesh Mondal · Cloud and DevOps Engineer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#060b1f;--fg:#f2f6ff;--mut:#a2b3d9;--ln:rgba(170,195,255,.17);--a:#ffd23f;--b:#ff5fa2;--c:#5eead4;--afg:#0a1a3a;--gl:rgba(160,190,255,.06);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f5ff;--fg:#0a1a3a;--mut:#4a5b82;--ln:rgba(10,26,58,.15);--a:#2563eb;--b:#db2777;--c:#0891b2;--afg:#fff;--gl:rgba(10,26,58,.045);color-scheme:light}}
:root[data-theme="light"]{--bg:#f1f5ff;--fg:#0a1a3a;--mut:#4a5b82;--ln:rgba(10,26,58,.15);--a:#2563eb;--b:#db2777;--c:#0891b2;--afg:#fff;--gl:rgba(10,26,58,.045);color-scheme:light}
:root[data-pal="1"]{--a:#ff4d9d;--b:#a855f7;--c:#38bdf8;--afg:#0a1a3a}
:root[data-pal="2"]{--a:#10b981;--b:#84cc16;--c:#22d3ee;--afg:#0a1a3a}
:root[data-pal="3"]{--a:#fb923c;--b:#ef4444;--c:#fbbf24;--afg:#0a1a3a}
:root[data-pal="4"]{--a:#38bdf8;--b:#6366f1;--c:#c084fc;--afg:#0a1a3a}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--fg);font:16px/1.65 "IBM Plex Sans",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:90}
h1,h2,h3,.mega,.big,.say,.logo,.mini strong,.pill{font-family:"Bricolage Grotesque",system-ui,sans-serif}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.w{max-width:1200px;margin:auto;padding:0 24px;position:relative;z-index:2}
main>section{padding:clamp(56px,9vw,120px) 0}
main>section.w{padding-left:24px;padding-right:24px}
.muted{color:var(--mut)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gt{background:linear-gradient(100deg,var(--a),var(--b),var(--c),var(--a));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 8s linear infinite}
@keyframes hue{to{background-position:250% 0}}
.aur{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aur i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(110px);opacity:.28;animation:fl 20s ease-in-out infinite alternate}
.aur i:nth-child(1){background:var(--a);top:-22vmax;left:-14vmax;translate:0 calc(var(--sy,0)*-.12px)}
.aur i:nth-child(2){background:var(--b);bottom:-26vmax;right:-12vmax;animation-delay:-7s;translate:0 calc(var(--sy,0)*-.22px)}
.aur i:nth-child(3){background:var(--c);top:35%;left:38%;opacity:.15;animation-delay:-13s;translate:0 calc(var(--sy,0)*-.07px)}
.aur::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--ln) 1px,transparent 1px);background-size:34px 34px;mask:radial-gradient(ellipse at 50% 30%,#000,transparent 72%)}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.2)}}
.glow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a) 16%,transparent),transparent 65%);pointer-events:none;z-index:1;will-change:transform}
@media (hover:none){.glow{display:none}}
.prog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:95;background:linear-gradient(90deg,var(--a),var(--b),var(--c));transform:scaleX(0);transform-origin:left}
.nav{position:fixed;z-index:80;top:calc(12px + env(safe-area-inset-top,0px));left:50%;translate:-50% 0;display:flex;align-items:center;gap:4px;padding:6px 8px 6px 18px;border:1px solid var(--ln);border-radius:999px;background:color-mix(in srgb,var(--bg) 68%,transparent);backdrop-filter:blur(16px);width:max-content;max-width:calc(100% - 16px)}
.logo{font-weight:800;margin-right:8px;white-space:nowrap}
.nb,.btn{transition:translate .3s cubic-bezier(.2,.8,.2,1),border-color .2s,background .2s,box-shadow .3s,color .2s;cursor:pointer;text-decoration:none;font:600 14px "IBM Plex Sans",sans-serif}
.nb{padding:8px 13px;border-radius:999px;border:0;background:none;color:var(--mut);white-space:nowrap}
.nb:hover{color:var(--fg);background:var(--gl)}
.nb.p{background:linear-gradient(100deg,var(--a),var(--b));color:var(--afg)}
.dots{position:fixed;right:18px;top:50%;translate:0 -50%;z-index:70;display:flex;flex-direction:column;gap:14px}
.dots button{position:relative;width:9px;height:9px;padding:0;border-radius:50%;border:1.5px solid var(--mut);background:none;cursor:pointer;transition:all .3s}
.dots button.on{background:var(--a);border-color:var(--a);scale:1.5;box-shadow:0 0 14px var(--a)}
.dots button::before{content:attr(data-t);position:absolute;right:20px;top:50%;translate:0 -50%;padding:3px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--ln);font-size:12px;color:var(--fg);opacity:0;pointer-events:none;transition:opacity .2s}
.dots button:hover::before{opacity:1}
@media (max-width:900px){.dots{display:none}}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;min-height:100svh;padding-top:110px!important}
.hero h1{font-size:clamp(3.6rem,11vw,9.2rem);line-height:.86;letter-spacing:-.045em;font-weight:800;transform:perspective(900px) rotateY(calc(var(--px,0)*7deg)) rotateX(calc(var(--py,0)*-5deg));transition:transform .25s ease-out}
.word{display:inline-block}
.ch{display:inline-block;background:linear-gradient(100deg,var(--fg) 30%,var(--a) 45%,var(--b) 55%,var(--fg) 70%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .9s cubic-bezier(.2,.8,.2,1) both,sh 5s ease-in-out infinite;animation-delay:calc(var(--i)*70ms),calc(var(--i)*-180ms)}
@keyframes rise{from{opacity:0;transform:translateY(.6em) rotateX(70deg) scale(.8);filter:blur(8px)}}
@keyframes sh{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.kick,.lead,.cta{animation:up .9s .8s cubic-bezier(.2,.8,.2,1) both}.lead{animation-delay:1s}.cta{animation-delay:1.2s}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
.kick{display:inline-flex;align-items:center;gap:10px;padding:6px 14px;margin-bottom:22px;border:1px solid var(--ln);border-radius:999px;background:var(--gl);font-size:14px;color:var(--mut)}
.kick::before,.live i{content:"";width:8px;height:8px;border-radius:50%;background:#34d399;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}100%{box-shadow:0 0 0 12px rgba(52,211,153,0)}}
.lead{font-size:clamp(1.1rem,2vw,1.4rem);max-width:28em;margin:26px 0 30px}
.swap{display:inline-block;padding:0 10px;background:linear-gradient(100deg,var(--a),var(--b));color:var(--afg);font-weight:600;border-radius:6px;animation:sw .5s ease}
@keyframes sw{from{opacity:0;transform:translateY(8px)}}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:999px;border:1px solid var(--ln);background:var(--gl);color:var(--fg)}
.btn:hover{border-color:var(--a);box-shadow:0 10px 30px -10px var(--a)}
.btn.p{position:relative;overflow:hidden;border-color:transparent;background:linear-gradient(100deg,var(--a),var(--b));color:var(--afg)}
.btn.p::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4s 2s infinite}
@keyframes shine{to{left:130%}}
.scene{--k:1;position:relative;width:min(100%,540px);aspect-ratio:1;margin:auto;perspective:1100px;animation:up 1.2s .4s both}
.rig{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(calc(-16deg + var(--py,0)*-9deg)) rotateY(calc(var(--px,0)*12deg));transition:transform .3s ease-out}
.orb{position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff,var(--a) 22%,var(--b) 58%,var(--c));box-shadow:0 0 70px var(--b),0 0 150px color-mix(in srgb,var(--a) 50%,transparent);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.ring{position:absolute;inset:0;transform-style:preserve-3d;animation:sp 34s linear infinite}
.ring.rev,.ring.rev .it span{animation-direction:reverse}
.ring.r2{animation-duration:26s}.ring.r2 .it span{animation-duration:26s}
.it{position:absolute;left:50%;top:50%;transform-style:preserve-3d;transform:rotateY(var(--t)) translateZ(calc(var(--r)*var(--k)*1px))}
.it span{display:block;translate:-50% -50%;white-space:nowrap;padding:7px 14px;border-radius:999px;border:1px solid var(--ln);background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(6px);font:600 13px "JetBrains Mono",monospace;transform:rotateY(calc(var(--t)*-1));animation:cs 34s linear infinite}
@keyframes sp{to{transform:rotateY(360deg)}}
@keyframes cs{from{transform:rotateY(calc(var(--t)*-1))}to{transform:rotateY(calc(var(--t)*-1 - 360deg))}}
.say{font-size:clamp(1.6rem,3.8vw,3rem);line-height:1.18;letter-spacing:-.03em;font-weight:800;max-width:24em}
.say span{opacity:.16;transition:opacity .4s,color .4s}.say span.on{opacity:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:44px 0 20px;max-width:900px}
.bands{margin:20px 0;transform:rotate(-2.2deg);position:relative;z-index:2}
.band{overflow:hidden;white-space:nowrap;padding:8px 0;mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:inline-flex;gap:14px;animation:mq var(--s) linear infinite}.track.rev{animation-direction:reverse}.band:hover .track{animation-play-state:paused}
.pill{padding:12px 26px;border-radius:999px;border:1px solid var(--ln);background:var(--gl);font-weight:600;font-size:clamp(1rem,2vw,1.35rem);transition:background .25s,color .25s,transform .25s}
.pill:hover{background:linear-gradient(100deg,var(--a),var(--b));color:var(--afg);transform:scale(1.08)}
@keyframes mq{to{transform:translateX(-50%)}}
.now{display:grid;grid-template-columns:1fr 1.15fr;gap:48px;align-items:start}
.live{display:inline-flex;align-items:center;gap:10px;color:var(--mut);margin-bottom:14px}.live i{display:block}
.now h2{font-size:clamp(2.2rem,5vw,4rem);line-height:1;letter-spacing:-.035em;margin-bottom:14px}
.card{position:relative;border:1px solid var(--ln);border-radius:24px;padding:30px;background:linear-gradient(160deg,var(--gl),transparent);backdrop-filter:blur(8px);overflow:hidden;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,border-color .3s,box-shadow .3s}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(300px circle at var(--mx,-999px) var(--my,-999px),color-mix(in srgb,var(--a) 20%,transparent),transparent)}
.card>*{position:relative}
.card:hover{border-color:color-mix(in srgb,var(--a) 50%,var(--ln));box-shadow:0 30px 60px -30px var(--a)}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
.proj::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0 62%,var(--a),var(--b),var(--c),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
@keyframes spin{to{--ang:360deg}}
.pts{padding-left:18px;margin:14px 0}.pts li{margin-bottom:10px}.pts li::marker{color:var(--a)}
.proj{margin-bottom:28px}.proj h3{font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.1;letter-spacing:-.025em;margin:6px 0 4px}
.mini{display:flex;flex-wrap:wrap;gap:14px 40px;margin:22px 0}
.mini strong{display:block;font-size:clamp(2.2rem,5vw,3.4rem);line-height:1;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.mini span{font-size:.85rem;color:var(--mut)}
.chip{display:inline-block;padding:3px 11px;margin:0 6px 8px 0;border:1px solid var(--ln);border-radius:999px;font:13px "JetBrains Mono",monospace;transition:transform .2s,border-color .2s}
.chip:hover{transform:translateY(-3px);border-color:var(--a)}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.bento .rv:first-child{grid-column:span 2}
.big{display:block;font-size:clamp(2.8rem,6vw,4.8rem);line-height:1;margin-bottom:10px;background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--a) 40%,transparent))}
.tl2{position:relative;padding-left:34px;max-width:760px}
.tl2::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--a),var(--b),var(--c));transform:scaleY(0);transform-origin:top;transition:transform 1.8s cubic-bezier(.2,.7,.2,1)}
.tl2.in::before{transform:scaleY(1)}
.ev{position:relative;padding-bottom:26px}
.ev::before{content:"";position:absolute;left:-34px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--a);transition:box-shadow .3s,background .3s}
.ev:hover::before{background:var(--a);box-shadow:0 0 16px var(--a)}
.ev b{display:block;font-size:1.15rem}.ev span{font:13px "JetBrains Mono",monospace}
.pdf{max-width:900px;margin:auto}
.pbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--ln);border-bottom:0;border-radius:18px 18px 0 0;background:var(--gl)}
.fn{font:13px "JetBrains Mono",monospace;color:var(--mut);margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tabs{display:flex;gap:6px}.tab{padding:6px 12px;border-radius:999px;border:1px solid var(--ln);background:none;color:var(--mut);font:600 14px "IBM Plex Sans",sans-serif;cursor:pointer}.tab.on{background:var(--a);color:var(--afg);border-color:transparent}
.zoom{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px}.zoom button{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:none;color:var(--fg);font-size:18px;cursor:pointer}
.pview{display:flex;flex-direction:column;max-height:78vh;overflow:auto;padding:24px;border:1px solid var(--ln);border-radius:0 0 18px 18px;background:color-mix(in srgb,var(--bg) 55%,#000 45%)}
.pg{display:block;max-width:none;height:auto;margin:0 auto 24px;background:#fff;border-radius:2px;box-shadow:0 18px 50px rgba(0,0,0,.45);transition:width .3s}
.mega{font-size:clamp(2.8rem,9vw,8rem);line-height:.95;letter-spacing:-.045em;font-weight:800;margin-bottom:48px}
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}.contact .card{margin:0}
label{display:block;margin-bottom:14px;font-size:.9rem;color:var(--mut)}
input,textarea{display:block;width:100%;margin-top:4px;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--fg);font:16px "IBM Plex Sans",sans-serif}
.links{display:flex;flex-direction:column;gap:12px}.note{min-height:1.5em;margin-top:10px;color:var(--a);font-size:.9rem}
.foot{position:relative;z-index:2;text-align:center;padding:32px 24px 56px;color:var(--mut);border-top:1px solid var(--ln)}
.rv{opacity:0;transform:translateY(40px) scale(.98);filter:blur(6px);transition:opacity .8s cubic-bezier(.2,.7,.2,1) calc(var(--i,0)*100ms),transform .8s cubic-bezier(.2,.7,.2,1) calc(var(--i,0)*100ms),filter .8s calc(var(--i,0)*100ms)}
.rv.in{opacity:1;transform:none;filter:none}
.sp{position:fixed;left:0;top:0;z-index:99;width:7px;height:7px;border-radius:50%;pointer-events:none;background:var(--a);box-shadow:0 0 10px var(--a);animation:spk .85s cubic-bezier(.1,.7,.3,1) forwards}
.sp.b{background:var(--b);box-shadow:0 0 10px var(--b)}
@keyframes spk{from{transform:translate(var(--x),var(--y))}to{opacity:0;transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy) + 50px)) scale(0)}}
@media (max-width:900px){.hero,.now,.contact,.cols{grid-template-columns:1fr}.hero{min-height:0;padding-top:100px!important}.scene{--k:.62;width:min(100%,420px)}.bento{grid-template-columns:1fr 1fr}.nb.h{display:none}.pview{padding:12px}}
@media (max-width:520px){.bento{grid-template-columns:1fr}.bento .rv:first-child{grid-column:auto}.logo{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none;filter:none}.say span{opacity:1}.glow,.sp{display:none}.tl2::before{transform:none}}
@media print{.nav,.dots,.aur,.glow,.prog{display:none!important}}
</style>
</head>
<body><div id="root"></div><script>/*APP*/</script></body>
</html>
